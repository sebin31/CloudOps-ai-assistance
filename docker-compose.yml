
services:

  backend:
    build: ./backend
    container_name: cloudops-backend

    environment:
      OLLAMA_URL: "http://host.docker.internal:11434/api/chat"
      OLLAMA_MODEL: "qwen2.5:1.5b"

    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: cloudops-frontend

    ports:
      - "8080:80"

    depends_on:
      - backend

    restart: unless-stopped
